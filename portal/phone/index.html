<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Pair this phone · AUKORA</title>
<link rel="stylesheet" href="/portal/phone/phone.css">
<script type="module" src="/portal/phone/phone.js"></script>
</head>
<body>
<main class="pair" data-stage="joining">
  <h1>Pair this phone</h1>
  <p class="pair-lead" id="lead">Opening the pairing…</p>
  <div class="pair-stage">
    <canvas id="frame" class="pair-frame" aria-label="Signed optical exchange frames"></canvas>
    <video id="camera" class="pair-camera" muted playsinline aria-label="Local camera preview"></video>
  </div>
  <output id="phase" class="pair-phase" aria-live="polite"></output>
  <button id="start" type="button" class="pair-start" disabled>Start</button>
  <p class="pair-note">Co-presence is evidence. It shows two screens saw each other; it grants no permission.</p>
</main>
</body>
</html>
