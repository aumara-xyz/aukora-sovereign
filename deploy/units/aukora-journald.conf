# Installed as journald.conf.d/60-aukora.conf. Keep persistent audit logs bounded while reserving host free space.
# Engine stdout has its own unit rate limit; the supervisor's door/gate audit stream explicitly disables limiting.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
