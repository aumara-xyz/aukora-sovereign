# The engine's authority overlay: applied by `dsh --patch` AFTER the profile and its user layer, so nothing the engine
# can write (its home, its settings) can undo it. Root-owned, inside the release (/engine/aukora, read-only).
#
# 1. The door, with the node's real values, and Kira 2's tools after it. They must match the door's policy (/etc/aukora/door-policy-v1.json):
#    socket /run/aukora-door/door.sock, workspace root /work. The launcher requires positive activation of both
#    packages (and every approved authority package); a disabled, missing or inactive plugin stops the engine.
- insert:
    - id: aukora-door
      name: '@aukora/door'
      config:
        socketPath: /run/aukora-door/door.sock
        workspaceRoots:
          - /work
    # Kira 2's tools (engine/plugins/aukora-kira): every kira_* call crosses the door, which holds the non-owner token;
    # the engine holds none. After the door, which it needs.
    - id: aukora-kira
      name: '@aukora/kira'
      config:
        selfSlot: aukora:self
        resumeSlot: aukora:resume

# 2. Off in the authority context (NORTH-STAR section C; wall test B12-B14): hot reload, the plugin manager and its
#    install tool, the web terminal, the desktop telemetry, "open in app" on the host, and the harness-development
#    context (it tells the model where a checkout of the harness lives).
- id: hmr
  disabled: true
- id: client-hmr
  disabled: true
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: terminal-controller
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: harness-dev-context
  disabled: true

# 3. No first-run sign-in form; the engine holds no model key (NODE.md, "The model"). The harness's preview notice
#    is acknowledged here: its "Continue" writes the acknowledgement to the profile's cordis.patch.yml, which is
#    root-owned and read-only inside the wall, so it can never persist and the modal notice would cover the chat
#    composer forever (found live, NODE.md O9). The version is the notice's copy version in 0.2.1-alpha.5
#    (ui-settings-models onboarding-copy.ts: WELCOME_NOTICE_VERSION in the ui-settings-general section).
- id: ui-settings-models
  config:
    credentialOnboarding: false
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-09-28.1'

# 4. The model path (NODE.md section 7). The DeepSeek adapter talks to the in-wall bridge (entry.mjs), which pipes to
#    the model broker outside the wall; the broker holds the owner's key and the owner-approved budget. The adapter's
#    own key is a placeholder (DEEPSEEK_API_KEY in entry.mjs). Images go inline (the broker serves no Files API), so
#    the inline budget stays under the broker's request limit (8 MiB).
- id: llm-deepseek
  config:
    baseURL: http://127.0.0.1:3081
    apiKeyEnv: DEEPSEEK_API_KEY
    maxInlineRequestImageBytes: 4194304
    # The adapter refuses to activate if its image quantum (10 MiB by default) exceeds the inline cap (node
    # rehearsal: "inlineImageOffloadByteQuantum must not exceed maxInlineRequestImageBytes"; a config dump never
    # activates the adapter, so the Mac composition run did not see it).
    inlineImageOffloadByteQuantum: 2097152
    filesApiTimeoutMs: 5000

# 5. The harness's request extensions that would upload the session log and the plugin inventory to the provider:
#    off. (The broker also removes any `dsh_*` member before a request leaves the node.)
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# 6. The Sovereign switches of the apps face (engine/plugins/aukora-face/PORT-NOTES.md, "Disabled in Sovereign"; the
#    preview sets the same row): no provider route or consent, no repo or web lens (the engine start would otherwise
#    run git rev-parse and arm the repo lens), no weights script, no organism reader, no voice. Here, after every layer
#    the engine can write, so the engine cannot turn them back on.
- id: aukora-face-apps
  config:
    providerSendConsent: false
    voiceEnabled: false
    voiceAutoStart: false
    repoLensRoot: ''
    repoLensLookups: 0
    webLensLookups: 0
    weightsControlScript: ''
    organismDshHome: ''
    organismRepo: ''
