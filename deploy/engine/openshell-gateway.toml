# The OpenShell 0.1.4 gateway for the engine: loopback only, docker compute driver, bind mounts on (the engine's mounts
# are fixed by engine-run.sh). Every key below RAN on the node rehearsal of 2026-10-17 (NODE.md O2, O3):
# - the wall test's keys (WALL-TEST-2026-10-17.md, finding 3): the docker driver, gateway-minted sandbox JWTs, driver
#   config and bind mounts allowed, resource admission off, the sandbox image pulled never (it is loaded from the pin);
# - NOT the wall test's dev setting: TLS is on and users authenticate with an mTLS client certificate;
#   allow_unauthenticated_users is false. The PKI is the gateway's own (`openshell-gateway generate-certs --output-dir
#   /var/lib/aukora-openshell/tls --server-san 127.0.0.1`, run by engine_install.py; root 0700). The CLI holds the
#   client pair as the registered gateway `aukora`; each sandbox's supervisor trusts the server through guest_tls_ca
#   and authenticates with its own sandbox JWT.
# A privileged port: only root can bind it, so no local user can stand in for the gateway (Grok review, part 7 #1).
[openshell]
version = 2

[openshell.gateway]
bind_address = "127.0.0.1:690"
log_level = "info"
compute_driver = "docker"
guest_tls_ca = "/var/lib/aukora-openshell/tls/ca.crt"

[openshell.gateway.tls]
cert_path = "/var/lib/aukora-openshell/tls/server/tls.crt"
key_path = "/var/lib/aukora-openshell/tls/server/tls.key"
client_ca_path = "/var/lib/aukora-openshell/tls/ca.crt"

[openshell.gateway.mtls_auth]
enabled = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/aukora-openshell/tls/jwt/signing.pem"
public_key_path = "/var/lib/aukora-openshell/tls/jwt/public.pem"
kid_path = "/var/lib/aukora-openshell/tls/jwt/kid"
gateway_id = "aukora-engine"

[openshell.gateway.auth]
allow_unauthenticated_users = false

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
default_image = "node:24-bookworm"
image_pull_policy = "never"
allow_driver_config = true
enable_bind_mounts = true

[openshell.drivers.docker.resource_admission]
enabled = false
