# The OpenShell 0.1.4 gateway for the engine: loopback only, docker compute driver, bind mounts on (the engine's mounts
# are fixed by engine-run.sh). The keys below are the ones the wall test needed ([RAN], WALL-TEST-2026-10-17.md,
# finding 3). The JWT key files are generated by the installer into /var/lib/aukora-openshell (root 0700).
# NOT the wall test's dev setting: allow_unauthenticated_users is false here; the CLI authenticates with the
# gateway's local client material. If the 0.1.4 gateway refuses that combination, the installer stops and NODE.md
# open item O3 applies (do not ship allow_unauthenticated_users=true on a public node).
# A privileged port: only root can bind it, so no local user can stand in for the gateway (Grok review, part 7 #1).
[openshell.gateway]
listen = "127.0.0.1:690"

[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/aukora-openshell/jwt/signing.pem"
public_key_path = "/var/lib/aukora-openshell/jwt/public.pem"
kid_path = "/var/lib/aukora-openshell/jwt/kid"
gateway_id = "aukora-engine"

[openshell.gateway.auth]
allow_unauthenticated_users = false

[openshell.drivers.docker]
allow_driver_config = true
enable_bind_mounts = true

[openshell.drivers.docker.resource_admission]
enabled = false
