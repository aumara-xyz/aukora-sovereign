[package]
name = "nostr"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canon = { path = "../canon" }
base64 = "=0.22.1"
bech32 = "=0.12.0"
chacha20 = "=0.10.2"
getrandom = "=0.4.3"
hex = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
k256 = { version = "=0.14.0", default-features = false, features = ["schnorr", "ecdh", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zeroize = "=1.9.1"
