[package]
name = "frontdoor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
canon = { version = "0.1.0", path = "../canon" }
getrandom = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
instant-acme = "0.8.5"
rustls = "0.23.45"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = "0.26.6"
tower = { version = "=0.5.3", features = ["util"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
