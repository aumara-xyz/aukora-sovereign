[package]
name = "frontdoor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canon = { path = "../canon" }
aumlok = { path = "../aumlok" }
aura = { path = "../aura" }
gate = { path = "../gate" }
axum = "=0.8.9"
base64 = "=0.22.1"
getrandom = "=0.4.3"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
zeroize = "=1.9.1"
