[package]
name = "supervisor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sovereign"
path = "src/main.rs"

[dependencies]
aumlok = { path = "../aumlok" }
aura = { path = "../aura" }
broker = { path = "../broker" }
canon = { path = "../canon" }
copresence = { path = "../copresence" }
floor = { path = "../floor" }
frontdoor = { path = "../frontdoor" }
gate = { path = "../gate" }
immune = { path = "../immune" }
invites = { path = "../invites" }
kira = { path = "../kira" }
launcher = { path = "../launcher" }
laya = { path = "../laya" }
messaging = { path = "../messaging" }
nostr = { path = "../nostr" }
relay = { path = "../relay" }
wasmcell = { path = "../wasmcell" }
getrandom = "=0.4.3"
hex = "=0.4.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ed25519-dalek = "=3.0.0"
zeroize = "=1.9.1"
base64 = "=0.22.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustix = { version = "=1.1.5", features = ["fs", "net", "process"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
p256 = { version = "=0.14.0", features = ["ecdsa"] }
