[package]
name = "supervisor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sovereign"
path = "src/main.rs"

[dependencies]
aumlok = { path = "../aumlok" }
aura = { path = "../aura" }
broker = { path = "../broker" }
canon = { path = "../canon" }
copresence = { path = "../copresence" }
floor = { path = "../floor" }
frontdoor = { path = "../frontdoor" }
gate = { path = "../gate" }
immune = { path = "../immune" }
invites = { path = "../invites" }
kira = { path = "../kira" }
launcher = { path = "../launcher" }
laya = { path = "../laya" }
messaging = { path = "../messaging" }
nostr = { path = "../nostr" }
relay = { path = "../relay" }
wasmcell = { path = "../wasmcell" }
getrandom = "=0.4.3"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
tokio = { version = "=1.53.3", features = ["fs", "io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
