[package]
name = "broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aura = { version = "0.1.0", path = "../aura" }
canon = { version = "0.1.0", path = "../canon" }
ed25519-dalek = "3.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
bytes = "1.12.1"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.190"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
