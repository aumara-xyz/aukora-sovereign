[package]
name = "broker"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canon = { path = "../canon" }
aura = { path = "../aura" }
gate = { path = "../gate" }
base64 = "=0.22.1"
bytes = "=1.12.1"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.11.1"
tokio = { version = "=1.53.3", features = ["rt", "sync", "time", "macros"] }
zeroize = "=1.9.1"
