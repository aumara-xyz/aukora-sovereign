[package]
name = "kira"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
aura = { version = "0.1.0", path = "../aura" }
canon = { version = "0.1.0", path = "../canon" }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.1"
