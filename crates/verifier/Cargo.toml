[package]
name = "verifier"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canon = { path = "../canon" }
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
k256 = { version = "=0.14.0", features = ["schnorr"] }
p256 = { version = "=0.14.0", features = ["ecdsa"] }
sha2 = "=0.11.1"

[[bin]]
name = "aukora-verify"
path = "src/main.rs"
