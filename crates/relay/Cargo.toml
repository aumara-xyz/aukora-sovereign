[package]
name = "relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nostr = { version = "0.1.0", path = "../nostr" }
serde_json = "=1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
