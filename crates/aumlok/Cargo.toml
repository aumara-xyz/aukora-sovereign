[package]
name = "aumlok"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
canon = { version = "0.1.0", path = "../canon" }
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
