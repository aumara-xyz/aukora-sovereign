[package]
name = "gate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
canon = { path = "../canon" }
aura = { path = "../aura" }
aumlok = { path = "../aumlok" }
base64 = "=0.22.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data", "utf8_iter"] }
icu_properties = "=2.3.0"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
