[package]
name = "floor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sovereign-floor"
path = "src/main.rs"

[dependencies]
aumlok = { version = "0.1.0", path = "../aumlok" }
aura = { version = "0.1.0", path = "../aura" }
base64 = "0.22.1"
canon = { version = "0.1.0", path = "../canon" }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
