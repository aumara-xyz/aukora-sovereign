[package]
name = "launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.190"
nix = { version = "0.31.3", features = ["sched", "mount", "fs", "process", "signal", "user", "socket", "resource"] }
thiserror = "2.0.21"

# The sandbox is Linux-only; other platforms build the crate without it.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
